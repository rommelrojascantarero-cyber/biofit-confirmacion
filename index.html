
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correo confirmado | Estudio BioFit</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080a08;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 42px 28px;
      background: #151915;
      border: 1px solid #303a28;
      border-radius: 22px;
    }

    .brand {
      color: #9CFF00;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 4px;
      margin-top: 5px;
    }

    .check {
      width: 76px;
      height: 76px;
      line-height: 76px;
      border-radius: 50%;
      background: #9CFF00;
      color: #101510;
      font-size: 42px;
      font-weight: bold;
      margin: 36px auto 22px;
    }

    h1 {
      font-size: 25px;
      line-height: 1.3;
    }

    p {
      color: #c5cbc2;
      font-size: 16px;
      line-height: 1.7;
    }

    .notice {
      margin-top: 28px;
      color: #9CFF00;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">BIOFIT</div>
    <div class="subtitle">STUDIO</div>

    <div class="check">✓</div>

    <h1>¡Correo confirmado correctamente!</h1>

    <p>
      Tu cuenta de Estudio BioFit está lista.
      Ya puedes regresar a la aplicación e iniciar
      sesión con tu correo electrónico y contraseña.
    </p>

    <p class="notice">
      ¡Bienvenido a la comunidad BioFit!
    </p>
  </main>
</body>
</html>
